name: Tinta Manga - obras sin imágenes

# Revisa cada día una tanda de obras de ManhwaWeb y publica en
# tinta-dead-series.json las que tienen sus imágenes borradas. La app las oculta.
on:
  schedule:
    - cron: '40 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tinta-dead-series
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Revisar obras
        run: node scripts/tinta-dead-series.mjs
      - name: Publicar la lista
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tinta-dead-series.json tinta-dead-series-state.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "tinta: lista de obras sin imágenes"
          git push
